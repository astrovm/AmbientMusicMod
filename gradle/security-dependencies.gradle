// These constraints apply to the plugin classpath as well as project dependencies.
// They do not add libraries to an APK or downgrade a newer resolved version.
def securityModules = [
    "org.bouncycastle:bcprov-jdk18on:1.86",
    "org.bouncycastle:bcpkix-jdk18on:1.86",
    "org.bouncycastle:bcutil-jdk18on:1.86",
    "org.bitbucket.b_c:jose4j:0.9.7",
    "org.apache.commons:commons-lang3:3.21.0",
    "org.jdom:jdom2:2.0.6.1",
    "org.apache.httpcomponents:httpclient:4.5.14"
]

gradle.beforeProject { project ->
    project.buildscript.configurations.configureEach { configuration ->
        securityModules.each { module ->
            project.buildscript.dependencies.constraints.add(configuration.name, module)
        }
    }
    def security = project.configurations.create("securityDependencies") {
        canBeResolved = false
        canBeConsumed = false
    }
    securityModules.each { module ->
        project.dependencies.constraints.add(security.name, module)
    }
    project.configurations.configureEach { configuration ->
        if (configuration != security) configuration.extendsFrom(security)
    }
}
