version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android:
        patterns: ['androidx.*', 'com.android.*', 'org.jetbrains.kotlin*', 'com.google.devtools.ksp*']
      protobuf-grpc:
        patterns: ['com.google.protobuf*', 'io.grpc*']
      dagger:
        patterns: ['com.google.dagger*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
