name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build, regression tests, and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --max-workers=3 --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-checks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  required-ci:
    name: CI / Required
    permissions: {}
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
